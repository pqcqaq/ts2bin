name: Phase 1 gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-windows:
    name: Frontend gate (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize locked typescript-go checkout
        shell: pwsh
        run: git submodule update --init --depth 1 -- typescript-go
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: typescript-go/go.sum
      - name: Run non-bypassable frontend stage
        shell: pwsh
        run: ./scripts/test-frontend.ps1

  replay-linux:
    name: Replay closure (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize locked typescript-go checkout
        run: git submodule update --init --depth 1 -- typescript-go
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: typescript-go/go.sum
      - name: Test current frontend and replay core
        working-directory: typescript-go
        run: go test ./internal/frontendwire ./internal/ast2bingo ./internal/bingo ./cmd/ts2bin ./cmd/ts2bin-replay -count=1
      - name: Vet current frontend and replay core
        working-directory: typescript-go
        run: go vet ./internal/frontendwire ./internal/ast2bingo ./internal/bingo ./cmd/ts2bin ./cmd/ts2bin-replay
      - name: Enforce checker-free replay dependency closure
        working-directory: typescript-go
        shell: bash
        run: |
          dependencies="$(go list -deps ./cmd/ts2bin-replay)"
          if grep -Eq '/internal/(ast|binder|checker|parser|tsoptions)(/|$)' <<<"$dependencies"; then
            printf '%s\n' "$dependencies" | grep -E '/internal/(ast|binder|checker|parser|tsoptions)(/|$)'
            exit 1
          fi

  fork-delivery:
    name: Locked fork delivery
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize locked typescript-go checkout
        shell: pwsh
        run: git submodule update --init --depth 1 -- typescript-go
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: typescript-go/go.sum
      - name: Verify remotely fetchable fork identity
        shell: pwsh
        run: ./scripts/verify-typescript-go-fork.ps1 -SkipFullTests
